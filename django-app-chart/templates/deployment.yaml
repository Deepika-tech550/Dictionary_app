apiVersion: apps/v1
kind: Deployment
metadata:
  name: translator-new-deployment
  labels:
    app: django
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      containers:
      - name: django-cnt
        image: itdeepikar747/translator-app:{{ .Values.image.tag }}
        ports:
        - containerPort: 8000
     

